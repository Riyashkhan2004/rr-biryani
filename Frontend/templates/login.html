{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RR Briyani Login</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background-image:url("{% static 'images/shop.png' %}");
background-size:cover;
background-position:center;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

position:relative;

}


body::before{

content:"";
position:absolute;

width:100%;
height:100%;

background:rgba(0,0,0,.70);

}



.login-box{

position:relative;
z-index:1;

 width:90%;
max-width:380px;

padding:40px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

border-radius:20px;

box-shadow:0 0 30px black;

text-align:center;

}



.logo{

width:110px;
height:110px;

border-radius:50%;

background:white;

padding:5px;

border:4px solid gold;

margin-bottom:15px;

}



h2{

color:gold;

margin-bottom:10px;

}



p{

color:white;

margin-bottom:20px;

}



/* input */

input{

width:100%;

padding:15px;

margin:10px 0;

border:none;

border-radius:10px;

outline:none;

font-size:16px;

}



/* password box */

.password-box{

position:relative;

}



.password-box input{

padding-right:45px;

}



.show-pass{

position:absolute;

right:15px;

top:25px;

cursor:pointer;

color:#555;

font-size:18px;

}



/* button */

button{

width:100%;

padding:15px;

border:none;

border-radius:10px;

background:gold;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:orange;

}



/* error */

.error{

color:#ff7675;

background:white;

padding:10px;

border-radius:8px;

margin-bottom:10px;

}
/* ================= MOBILE RESPONSIVE ================= */

@media (max-width:768px){

body{
    padding:20px;
    height:auto;
    min-height:100vh;
}

.login-box{
    width:100%;
    max-width:400px;
    padding:30px 25px;
}

.logo{
    width:90px;
    height:90px;
}

h2{
    font-size:28px;
}

p{
    font-size:15px;
}

input{
    padding:14px;
    font-size:16px;
}

button{
    padding:14px;
    font-size:17px;
}

.show-pass{
    top:22px;
    right:15px;
}

}

/* Small Mobile */

@media (max-width:480px){

.login-box{
    padding:25px 18px;
    border-radius:15px;
}

.logo{
    width:75px;
    height:75px;
}

h2{
    font-size:24px;
}

p{
    font-size:14px;
}

input{
    padding:13px;
    font-size:15px;
}

button{
    padding:13px;
    font-size:16px;
}

.show-pass{
    top:20px;
    font-size:16px;
}

}

</style>


</head>


<body>



<div class="login-box">


<img src="{% static 'images/logo.png' %}" class="logo">


<h2>RR BRIYANI</h2>


<p>
Taste Of Tradition 🍽️
</p>



{% if messages %}

{% for message in messages %}

<div class="error">

{{ message }}

</div>

{% endfor %}

{% endif %}




<form method="POST" autocomplete="off">


{% csrf_token %}



<input 
type="text"
name="username"
placeholder="Username"
autocomplete="off"
value="rr"
required
>



<div class="password-box">


<input

type="password"

id="password"

name="password"

placeholder="Password"

autocomplete="new-password"

value="Sarath"

required

>



<span 
class="show-pass"
onclick="showPassword()">

👁️

</span>



</div>



<button type="submit">

LOGIN

</button>



</form>



</div>





<script>


function showPassword(){


let pass = document.getElementById("password");


if(pass.type === "password"){

pass.type="text";

}

else{

pass.type="password";

}


}


</script>



</body>

</html>
