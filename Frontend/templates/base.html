{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}RR Briyani{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f8f9fa;
overflow-x:hidden;
}

/* NAVBAR */

.navbar{

background:linear-gradient(90deg,#1b0835,#2b124c,#3f1d73);

box-shadow:0 8px 20px rgba(0,0,0,.3);

padding:10px 20px;

}

.navbar-brand{

display:flex;

align-items:center;

}

.navbar-brand img{

width:60px;

height:60px;

border-radius:50%;

background:white;

padding:4px;

border:3px solid gold;

}

.logo-text{

margin-left:12px;

}

.logo-text h2{

color:gold;

font-size:24px;

margin:0;

font-weight:bold;

}

.logo-text p{

color:white;

font-size:13px;

margin:0;

}

.nav-link{

color:white !important;

font-weight:600;

margin:5px;

padding:10px 18px !important;

border-radius:30px;

transition:.3s;

text-align:center;

}

.nav-link:hover{

background:gold;

color:black !important;

}

.home-btn{

background:gold;

color:black !important;

}

.login-btn{

background:white;

color:#2b124c !important;

}

.login-btn:hover{

background:gold;

color:black !important;

}

.navbar-toggler{

border:none;

background:white;

}

.container-fluid-page{

width:100%;

padding:0;

margin:0;

}

@media(max-width:768px){

.navbar-brand img{

width:50px;

height:50px;

}

.logo-text h2{

font-size:18px;

}

.logo-text p{

font-size:11px;

}

.nav-link{

margin:8px 0;

}

}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg sticky-top">

<div class="container">

<a class="navbar-brand" href="{% url 'home' %}">

<img src="{% static 'images/logo.png' %}">

<div class="logo-text">

<h2>RR BRIYANI</h2>

<p>Taste Of Tradition</p>

</div>

</a>

<button class="navbar-toggler" type="button"
data-bs-toggle="collapse"
data-bs-target="#navbarMenu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse justify-content-end"
id="navbarMenu">

<ul class="navbar-nav align-items-lg-center">

<li class="nav-item">

<a class="nav-link home-btn"
href="{% url 'home' %}">
🏠 Home
</a>

</li>

<li class="nav-item">

<a class="nav-link"
href="{% url 'menu' %}">
🍽 Menu
</a>

</li>

<li class="nav-item">

<a class="nav-link"
href="{% url 'about' %}">
👨‍🍳 About
</a>

</li>

<li class="nav-item">

<a class="nav-link"
href="{% url 'order' %}">
📦 Order
</a>

</li>

<li class="nav-item">

<a class="nav-link"
href="{% url 'contact' %}">
📞 Contact
</a>

</li>

<li class="nav-item">

<a class="nav-link login-btn"
href="{% url 'login' %}">
🔐 Login
</a>

</li>

</ul>

</div>

</div>

</nav>

<div class="container-fluid-page">

{% block content %}
{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
